name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build & Publish Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        run: npm test

      - name: Check existing release assets
        id: check_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $hasInstaller = "false"
          if ($env:TAG_NAME -like "v*") {
            $assetsJson = gh release view $env:TAG_NAME --json assets 2>$null
            if ($LASTEXITCODE -eq 0 -and $assetsJson) {
              $assets = ($assetsJson | ConvertFrom-Json).assets
              if ($assets | Where-Object { $_.name -like "NetInventory-Setup-*.exe" }) {
                $hasInstaller = "true"
                Write-Host "Release $env:TAG_NAME already has NetInventory-Setup-*.exe attached; skipping rebuild."
              }
            }
          }
          "has_installer=$hasInstaller" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Inno Setup
        if: steps.check_release.outputs.has_installer != 'true'
        run: choco install innosetup -y --no-progress

      - name: Build Installer (.exe)
        if: steps.check_release.outputs.has_installer != 'true'
        run: npm run build:installer

      - name: Upload Installer to GitHub Release
        if: steps.check_release.outputs.has_installer != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/NetInventory-Setup-*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
