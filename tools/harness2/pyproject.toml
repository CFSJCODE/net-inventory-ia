[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netinventory-harness2"
version = "0.1.0"
description = "Tarefas do Net-Inventory como adaptador do Harness² para refinar o harness dos agentes de código"
license = "MIT"
requires-python = ">=3.12,<3.14"
# O harness2 é instalado do checkout fixado pelo setup.sh (não está no PyPI).
dependencies = []

[project.scripts]
ni-harness2 = "netinventory_harness2.cli:main"

[tool.setuptools.packages.find]
include = ["netinventory_harness2*"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["netinventory_harness2"]
known-third-party = ["harness2"]
